[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aether"
version = "0.1.0"
description = "Aether — a self-learning market intelligence brain for intraday reversal trading."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "httpx>=0.27",
    "pandas>=2.1",
    "pyarrow>=14.0",
    "numpy>=1.26",
    "tenacity>=8.2",
    # torch is intentionally NOT pinned to a CPU/CUDA variant here.
    # Install the build matching your hardware, e.g.:
    #   pip install torch --index-url https://download.pytorch.org/whl/cu124   (GPU)
    #   pip install torch --index-url https://download.pytorch.org/whl/cpu     (CPU)
    "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
dashboard = ["streamlit>=1.35", "plotly>=5.20"]

[tool.setuptools.packages.find]
include = ["aether*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
